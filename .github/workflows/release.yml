# Publishes a GitHub release with the Windows installer whenever the VERSION
# file on main changes - bump the number (even from GitHub's web editor) to
# release. Tests run first; nothing is published if they fail, and an
# existing release for the same version is never replaced.
# Editing this file runs it too - how to retry a version whose run failed.
#
# It builds from the repo alone on a clean Windows machine: build_installer.py
# makes buddy.zip and compiles installer/Buddy.iss with Inno Setup. buddy.zip,
# Buddy.py and buddy-update.json (build_update_manifest.py) go on the release
# too: they're what a running Buddy updates itself from (app/core/updater.py).
#
# Two jobs. "build" runs the tests and builds with a read-only token - it is
# the one that runs pip-installed packages and Inno Setup - and hands the
# files over; only "publish", which runs nothing of the repo's or its
# packages', can write to the release. Every action is pinned to a reviewed
# commit (the comment gives the release it is): update one by looking up the
# new tag's commit, never by pointing at a tag that can move.

name: Release

on:
  push:
    branches: [main]
    paths:
      - VERSION
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.exists.outputs.skip }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The token isn't left in .git/config for the steps that install
          # packages and run code; only the gh steps get it (GH_TOKEN).
          persist-credentials: false

      - name: Read VERSION
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 1.2.3 (got '$v')" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version $v"

      - name: Skip if this version is already released
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v${{ steps.version.outputs.version }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "skip=true" >> $env:GITHUB_OUTPUT
            "v${{ steps.version.outputs.version }} already exists - bump VERSION to release again."
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.exists.outputs.skip == 'false'
        with:
          python-version: "3.13"

      # Full PySide6, not PySide6-Essentials: the tool pages are QtWebEngine
      # views (QtWebChannel and QtWebEngine are in its Addons half).
      - name: Run the tests
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --disable-pip-version-check --progress-bar off "PySide6>=6.10,<7" "cryptography>=50.0" "pillow>=12.3"
          python tests/run_suite.py -v *> test-output.txt   # exits before Qt WebEngine's teardown, which can crash
          $code = $LASTEXITCODE
          Get-Content test-output.txt
          if ($code -ne 0) {
            # Name each failure where the run's page shows it: the full log
            # above is only visible to signed-in GitHub accounts.
            $lines = @(Get-Content test-output.txt)
            $found = 0
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match '^(FAIL|ERROR): (.+)$') {
                $test = "$($Matches[1]) $($Matches[2])"
                $end = [Math]::Min($i + 60, $lines.Count - 1)
                $why = @($lines[($i + 1)..$end] | Where-Object { $_ -match '^[\w.]*(Error|Exception|Failure)\b' }) | Select-Object -First 1
                "::error title=$test::$($why -replace '%', '%25')"
                $found++
              }
            }
            if ($found -eq 0) {
              # No test failed by name: the run itself died. Show how it ended.
              $tail = ($lines | Select-Object -Last 8) -join ' | '
              "::error title=Tests stopped (exit $code)::$($tail -replace '%', '%25')"
            }
            exit $code
          }

      # A warning, not a stop: PyPI's advisory data for the lowest version each
      # requirement allows (the floors in installer/requirements.txt).
      - name: Check the dependency floors for known advisories
        if: steps.exists.outputs.skip == 'false'
        continue-on-error: true
        shell: pwsh
        run: python tools/check_dependencies.py

      - name: Install Inno Setup
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: |
          $iscc = @("$env:ProgramFiles\Inno Setup 7\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
                    "$env:ProgramFiles\Inno Setup 6\ISCC.exe", "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") |
                  Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup -y --no-progress }

      - name: Build the installer
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: python build_installer.py

      - name: Write the update manifest
        if: steps.exists.outputs.skip == 'false'
        shell: pwsh
        run: python build_update_manifest.py --platform windows

      - name: Hand the files to the publish job
        if: steps.exists.outputs.skip == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/BuddySetup-${{ steps.version.outputs.version }}.exe
            dist/buddy-update.json
            buddy.zip
            Buddy.py
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.skip == 'false'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: .

      - name: Publish the release
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $exe = "dist/BuddySetup-$v.exe"
          $sha = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          **To install:** download BuddySetup-$v.exe below and double-click it. Then open DaVinci Resolve and choose Workspace > Scripts > Buddy.

          Windows may say "Windows protected your PC" (the installer isn't code-signed): click More info > Run anyway. Only ever download it from this page.

          SHA-256 of BuddySetup-$v.exe: ``$sha`` - to check a download, run ``Get-FileHash BuddySetup-$v.exe`` in PowerShell and compare.
          "@
          # buddy.zip, Buddy.py, buddy-update.json: for Buddy's own Update button.
          gh release create "v$v" $exe buddy.zip Buddy.py dist/buddy-update.json --title "Buddy $v" --notes $notes --generate-notes --target $env:GITHUB_SHA
