# GIF search's GIPHY key, installed by setup.sh and push.sh as
# /etc/systemd/system/buddy-network.service.d/giphy.conf. The key itself is
# in /etc/buddy-network/giphy.env (root's alone - set-giphy-key.sh writes
# it), never in this repo. No file there: no GIF search, nothing else changes.
[Service]
EnvironmentFile=-/etc/buddy-network/giphy.env
