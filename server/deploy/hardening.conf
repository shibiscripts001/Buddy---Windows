# Extra limits for the Buddy Network service, installed by setup.sh and
# push.sh as /etc/systemd/system/buddy-network.service.d/hardening.conf.
# If the service won't start with a release and it, push.sh puts the release
# that was running back and stops with an error - it never carries on without them.
[Service]
# However many connections come in, the server can't take the whole machine.
LimitNOFILE=8192
MemoryMax=600M
TasksMax=64
# It needs no special powers, devices or kernel access - only network sockets.
CapabilityBoundingSet=
AmbientCapabilities=
PrivateDevices=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
SystemCallFilter=@system-service
# Files it makes (the database) are readable by it alone.
UMask=0077
