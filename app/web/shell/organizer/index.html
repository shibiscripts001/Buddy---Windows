<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src file: qrc:; style-src file: 'unsafe-inline'; font-src file:; img-src file: data:">
    <title>Organize sidebar</title>
    <link rel="stylesheet" href="../../buddy.css">
    <link rel="stylesheet" href="../shell.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <script src="../../buddy.js"></script>
</head>
<body class="window">
<main class="dialog">
    <p class="set-hint">Drag to reorder. Untick a tool to hide its tab – hidden tools keep running (Time Tracker
        still tracks). Dividers are the headings between groups; leave one's name blank for a plain line.</p>
    <div class="org-body">
        <ol class="org-list" id="list"></ol>
        <div class="org-side">
            <button type="button" class="btn" id="add">Add divider…</button>
            <button type="button" class="btn" id="show-all">Show all tools</button>
        </div>
    </div>
    <div class="set-hint" id="note" role="status"></div>
    <div class="dialog-foot">
        <button type="button" class="btn" id="reset">Reset to default</button>
        <div class="spacer"></div>
        <button type="button" class="btn" id="cancel">Cancel</button>
        <button type="button" class="btn accent" id="save">Save</button>
    </div>
</main>
<script src="organizer.js"></script>
</body>
</html>
